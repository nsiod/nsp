services:
  nsp:
    # Built locally by `bun run e2e` from the repo root Dockerfile.
    image: nsp:e2e
    container_name: nsp-e2e
    hostname: nsp
    # Tag every e2e-suite container with a stable label so teardown
    # can sweep up by label rather than by name. Also covers any
    # auxiliary containers compose might spawn in the future without
    # explicit container_name entries.
    labels:
      nsp.e2e: "true"
    networks:
      e2e:
        aliases: [nsp]
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      NSP_MASTER_KEY: ${NSP_MASTER_KEY:?set NSP_MASTER_KEY}
      NSP_DOMAIN: nsp.e2e.local
      NSP_ADMIN_PASSWORD: ${NSP_ADMIN_PASSWORD:-changeme}
      NSP_TLS: "false"
      NSP_LISTEN: "0.0.0.0:8443"
      # WireGuard — kernel netlink backend.
      NSP_WG: "true"
      NSP_WG_BACKEND: kernel
      NSP_WG_PORT: "51820"
      NSP_WG_INTERFACE: wg0
      NSP_WG_SUBNET: 10.99.99.0/24
      # Shadowsocks — second protocol exercised end-to-end.
      NSP_SS: "true"
      NSP_SS_BIND: 0.0.0.0
      NSP_SS_PORT: "4433"
      # Metrics — bearer-token auth so we can scrape from the tester.
      NSP_METRICS: "true"
      NSP_METRICS_TOKEN: ${NSP_METRICS_TOKEN:-e2e-metrics-secret}
      NSP_BACKUP: "false"
      NSP_ALLOW_INSECURE_NO_MASTER_KEY: "false"
      NSP_DB: /work/data/proxy.db
      NSP_WORK_DIR: /work
      # Reverse-API control center (phase 13). Always-on, but the
      # mock returns an empty snapshot by default so other phases
      # are not affected. The phase-13 test programs the mock's
      # response and asserts nsp converges accordingly.
      NSP_CONTROL: "true"
      NSP_CONTROL_URL: http://mock-control:9090
      NSP_CONTROL_NODE_ID: node-e2e
      NSP_CONTROL_TOKEN: ${MOCK_CONTROL_TOKEN:-e2e-control-secret}
      NSP_CONTROL_INTERVAL_SECS: "2"
      NSP_CONTROL_STATUS_INTERVAL_SECS: "2"
      RUST_LOG: nsp=debug,nsp_wg_driver=debug,nsp_ss_driver=debug,nsp_api=debug,info
    expose:
      - "8443"
      - "4433"
      - "51820/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8443/api/healthz || exit 1"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s
    depends_on:
      mock-control:
        condition: service_healthy

  # Mock control center for phase 13. Speaks the reverse-API
  # protocol from `docs/control-center.md` plus a `/__test__/*`
  # interface the tester drives. Defaults to an empty snapshot so
  # always-on doesn't perturb the rest of the suite.
  mock-control:
    build:
      context: ./mock-control
      dockerfile: Dockerfile
    image: nsp-e2e-mock-control:latest
    container_name: nsp-e2e-mock-control
    hostname: mock-control
    labels:
      nsp.e2e: "true"
    networks:
      e2e:
        aliases: [mock-control]
    environment:
      MOCK_CONTROL_TOKEN: ${MOCK_CONTROL_TOKEN:-e2e-control-secret}
      PORT: "9090"
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/__test__/health"]
      interval: 1s
      timeout: 2s
      retries: 15
      start_period: 1s

  tester:
    build:
      context: .
      dockerfile: Dockerfile.tester
    image: nsp-e2e-tester:latest
    container_name: nsp-e2e-tester
    labels:
      nsp.e2e: "true"
    networks:
      e2e:
    # NET_ADMIN: the data-plane phase brings up its own kernel WG
    # interface inside this container and pings the server through it.
    cap_add:
      - NET_ADMIN
    environment:
      NSP_BASE: http://nsp:8443
      NSP_ADMIN_PASSWORD: ${NSP_ADMIN_PASSWORD:-changeme}
      NSP_METRICS_TOKEN: ${NSP_METRICS_TOKEN:-e2e-metrics-secret}
      NSP_SERVER_HOST: nsp
      # Reverse-API mock for phase 13. The mock listens on the
      # `mock-control` hostname inside the e2e network; the tester
      # uses these to drive scenarios via `/__test__/*`.
      MOCK_CONTROL_BASE: http://mock-control:9090
      MOCK_CONTROL_NODE_ID: node-e2e
      # nsp's NSP_CONTROL_INTERVAL_SECS — tests use this to pick a
      # safe wait budget for sync convergence.
      NSP_CONTROL_INTERVAL_SECS: "2"
    # The tester writes a JUnit report to /results inside the
    # container; the bind mount surfaces it to the host so CI / the
    # runner can read it. `runner.ts` clears this directory on each
    # invocation.
    volumes:
      - ./results:/results
    depends_on:
      nsp:
        condition: service_healthy
    # Default command lives in Dockerfile.tester (CMD ["bun", "test",
    # ..., "--reporter=junit", ...]). Override here only when
    # debugging (e.g. `bun test --bail --test-name-pattern …`).

networks:
  e2e:
    name: nsp-e2e-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.231.99.0/24
